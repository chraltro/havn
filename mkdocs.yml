site_name: havn
site_description: The open-source data platform that runs on your machine. DuckDB + SQL transforms + Python. Data in safe waters.
site_url: https://chraltro.github.io/db
repo_url: https://github.com/chraltro/havn
repo_name: chraltro/havn

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
  font:
    text: Outfit
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Transforms: transforms.md
  - Seeds: seeds.md
  - Sources: sources.md
  - Data Quality: quality.md
  - Contracts: contracts.md
  - Macros: macros.md
  - Lineage: lineage.md
  - Masking: masking.md
  - Notebooks: notebooks.md
  - Pipelines: pipelines.md
  - Scheduler: scheduler.md
  - Connectors: connectors.md
  - CDC: cdc.md
  - Versioning: versioning.md
  - Environments: environments.md
  - Auth: auth.md
  - CLI Reference: cli-reference.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
