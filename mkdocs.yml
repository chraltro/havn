site_name: havn
site_description: Self-hosted data platform built on DuckDB. Plain SQL transforms, Python ingest, one warehouse file.
site_url: https://chraltro.github.io/havn/docs/
repo_url: https://github.com/chraltro/havn
repo_name: chraltro/havn

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Transforms: transforms.md
  - Python Models: python-models.md
  - Seeds: seeds.md
  - Sources: sources.md
  - Data Quality: quality.md
  - Unit Tests: unit-tests.md
  - Contracts: contracts.md
  - Macros: macros.md
  - Packages: packages.md
  - Semantic Layer: semantic-layer.md
  - Ask: ask.md
  - Lineage: lineage.md
  - Masking: masking.md
  - Governance: governance.md
  - Dashboards and Sharing: dashboards-sharing.md
  - Notebooks: notebooks.md
  - Pipelines: pipelines.md
  - Scheduler: scheduler.md
  - Connectors: connectors.md
  - CDC: cdc.md
  - Live Models: live-models.md
  - Versioning: versioning.md
  - Environments: environments.md
  - Branches: branches.md
  - Refactoring: refactoring.md
  - Performance: performance.md
  - Telemetry: telemetry.md
  - Auth: auth.md
  - MCP Server: mcp.md
  - What havn Supports: limitations.md
  - CLI Reference: cli-reference.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
