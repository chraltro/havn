contracts:
  - name: product_catalog_valid
    description: "Product catalog must have unique products with prices"
    model: gold.product_catalog
    severity: error
    assertions:
      - row_count > 0
      - no_nulls(product_id)
      - unique(product_id)

  - name: dim_product_complete
    description: "Product dimension should have no null names"
    model: silver.dim_product
    severity: warn
    assertions:
      - row_count > 0
      - no_nulls(product_id)
      - no_nulls(name)
