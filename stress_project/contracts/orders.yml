contracts:
  - name: orders_not_empty
    description: "Orders fact table must contain data with valid keys"
    model: silver.fct_orders
    severity: error
    assertions:
      - row_count > 0
      - row_count > {previous * 0.9}
      - no_nulls(order_id)
      - unique(order_id)
      - no_nulls(customer_id)
      - "total_amount >= 0"
      - freshness < 24h

  - name: orders_volume_stable
    description: "Orders volume should not spike or crash unexpectedly"
    model: silver.fct_orders
    severity: warning
    escalate_after: 3
    assertions:
      - row_count > {previous * 0.8}
      - row_count < {previous * 2.0}
