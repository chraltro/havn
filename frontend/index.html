<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>havn</title>
    <!-- Google Fonts for all themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Crimson+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Source+Serif+4:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--havn-font, 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif);
        background: var(--havn-bg, #0B0E14);
        color: var(--havn-text, #D0D6E0);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Smooth theme transitions */
      body, body * {
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
      /* Exclude canvas and Monaco from transitions */
      canvas, .monaco-editor, .monaco-editor * {
        transition: none !important;
      }

      /* Scrollbar theming */
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: var(--havn-bg, #0B0E14); }
      ::-webkit-scrollbar-thumb { background: var(--havn-border-light, #263044); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--havn-text-dim, #3A4560); }
      ::selection { background: var(--havn-accent, #3ECFB4); color: var(--havn-bg, #0B0E14); }

      /* ── Button interactive states ── */
      button {
        transition: background-color 0.12s ease, border-color 0.12s ease,
                    color 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease,
                    filter 0.12s ease, transform 0.08s ease;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      button:active:not(:disabled) {
        filter: brightness(0.92);
        transform: translateY(0.5px);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed !important;
        filter: saturate(0.3);
      }

      /* ── Input / textarea / select focus ── */
      input, textarea, select {
        transition: border-color 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--havn-accent, #3ECFB4) !important;
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--havn-accent, #3ECFB4) 18%, transparent);
      }

      /* ── Table row hover ── */
      table tbody tr {
        transition: background-color 0.08s ease;
      }
      table tbody tr:hover {
        background-color: color-mix(in srgb, var(--havn-accent, #3ECFB4) 5%, transparent);
      }

      /* ── Tab hover (data-havn-tab) ── */
      [data-havn-tab] {
        transition: color 0.1s ease, border-color 0.1s ease, background-color 0.1s ease !important;
      }
      [data-havn-tab]:hover:not([data-havn-active="true"]) {
        color: var(--havn-text, #D0D6E0) !important;
        background-color: color-mix(in srgb, var(--havn-text, #D0D6E0) 6%, transparent);
      }

      /* ── File tree item hover ── */
      [data-havn-file] {
        transition: background-color 0.08s ease;
        border-radius: 3px;
      }
      [data-havn-file]:hover {
        background-color: color-mix(in srgb, var(--havn-accent, #3ECFB4) 8%, transparent) !important;
      }

      /* ── Notebook item hover ── */
      [data-havn-notebook] {
        transition: background-color 0.1s ease, border-color 0.1s ease;
      }
      [data-havn-notebook]:hover {
        background-color: var(--havn-bg-secondary, #121620) !important;
        border-color: var(--havn-accent, #3ECFB4) !important;
      }

      /* ── Theme card hover ── */
      [data-havn-theme-card] {
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease !important;
      }
      [data-havn-theme-card]:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      }

      /* ── Delete / danger button hover ── */
      [data-havn-danger]:hover:not(:disabled) {
        background-color: color-mix(in srgb, var(--havn-red, #F87171) 15%, transparent) !important;
        filter: none;
      }

      /* ── Table item hover in sidebar (TablesPanel) ── */
      [data-havn-table-item] {
        transition: background-color 0.08s ease;
      }
      [data-havn-table-item]:hover {
        background-color: color-mix(in srgb, var(--havn-accent, #3ECFB4) 8%, transparent) !important;
      }

      /* ── Spinner animation ── */
      @keyframes havn-spin { to { transform: rotate(360deg); } }
      @keyframes havn-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      /* ── Resize handle ── */
      [data-havn-resize-handle] {
        transition: background-color 0.12s ease;
      }
      [data-havn-resize-handle]:hover {
        background-color: color-mix(in srgb, var(--havn-accent, #3ECFB4) 10%, transparent);
      }

      /* ── Keyboard focus indicators (visible only for keyboard navigation) ── */
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--havn-accent, #3ECFB4);
        outline-offset: 2px;
      }

      /* ── Resource panel ── */
      .resource-panel { padding: 16px 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
      .resource-panel-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .resource-panel-header h2 { font-size: 18px; font-weight: 600; }
      .resource-panel-summary { color: var(--havn-text-dim, #8A94A7); font-size: 13px; }
      .resource-error { background: #3b1212; color: #ffb4b4; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
      .resource-capacity-bar { display: flex; flex-direction: column; gap: 4px; }
      .resource-capacity-bar-inner { display: flex; width: 100%; height: 10px; border-radius: 5px; overflow: hidden; background: var(--havn-border-light, #263044); }
      .resource-capacity-slice { height: 100%; }
      .resource-capacity-label { font-size: 12px; color: var(--havn-text-dim, #8A94A7); }
      .resource-category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .resource-category-card { padding: 12px; border: 1px solid var(--havn-border-light, #263044); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
      .resource-category-head { display: flex; align-items: center; gap: 8px; }
      .resource-category-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
      .resource-category-name { flex: 1; text-transform: capitalize; font-weight: 500; }
      .resource-category-active { font-size: 12px; color: var(--havn-text-dim, #8A94A7); font-variant-numeric: tabular-nums; }
      .resource-category-utilization { background: var(--havn-border-light, #263044); height: 4px; border-radius: 2px; overflow: hidden; }
      .resource-category-utilization-bar { height: 100%; transition: width 0.2s ease; }
      .resource-category-dials { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      .resource-category-dials label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--havn-text-dim, #8A94A7); }
      .resource-category-dials input { width: 84px; padding: 3px 6px; border: 1px solid var(--havn-border-light, #263044); background: var(--havn-bg, #0B0E14); color: var(--havn-text, #D0D6E0); border-radius: 4px; font-variant-numeric: tabular-nums; }
      .resource-category-actions { display: flex; gap: 6px; }
      .resource-category-actions button { flex: 1; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--havn-border-light, #263044); background: var(--havn-bg-raised, #141923); color: var(--havn-text, #D0D6E0); cursor: pointer; }
      .resource-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--havn-text-dim, #8A94A7); }
      .resource-task-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .resource-task-table th, .resource-task-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--havn-border-light, #263044); }
      .resource-task-table th { color: var(--havn-text-dim, #8A94A7); font-weight: 500; }
      .resource-cancel { padding: 2px 6px; font-size: 11px; border-radius: 3px; border: 1px solid #7a3b3b; background: transparent; color: #ffb4b4; cursor: pointer; }
      .resource-cancel:hover { background: #3b1212; }
      .resource-empty { font-size: 12px; color: var(--havn-text-dim, #8A94A7); padding: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
