name: CI

# CI on push is intentionally disabled. The full test suite (1300+ tests
# across DuckDB connections, schema operations, real SQL) runs ~15-20
# minutes per Python version. Even with pytest-xdist, GitHub's free-tier
# 2-vCPU runners cap the speedup at ~2x. Since the project doesn't use
# PRs, CI on push is the only place tests would run on push, and a
# failure here was always treated as a noisy non-blocker — releases
# (publish.yml + docker.yml on `release: published`) build their own
# wheel/image and have never been gated by CI.
#
# Coverage is preserved by .github/workflows/nightly.yml which runs the
# FULL suite (incl. @pytest.mark.slow) across Python 3.10/3.11/3.12 at
# 03:00 UTC daily.
#
# To run CI on demand for a particular commit, use the "Run workflow"
# button in the Actions UI (`workflow_dispatch` below), or push a PR.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # -n auto = pytest-xdist parallelisation across all available
        # GitHub-runner cores (typically 4). Slow tests are still
        # @pytest.mark.slow-skipped here; nightly runs them with --runslow.
        # If a test isn't parallel-safe, mark it @pytest.mark.serial or
        # use a unique tmp_path / database fixture.
        run: pytest tests/ -n auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check SQL lint
        run: |
          # Only lint if there's a project with SQL files
          if [ -d "transform" ]; then
            havn lint
          else
            echo "No transform directory found, skipping SQL lint"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
