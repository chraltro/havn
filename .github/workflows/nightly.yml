name: Nightly (slow tests)

# Runs the FULL test suite — including @pytest.mark.slow tests that the
# regular CI workflow skips. Triggered nightly at 03:00 UTC and on demand.
# A failure here doesn't block any release; it's a heads-up that something
# regressed in the slow path (stress, hot-reload, maintenance scheduler).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite (incl. slow)
        run: pytest tests/ -v --runslow
