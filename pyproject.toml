[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "havn"
version = "0.2.15"
description = "Self-hosted data platform. A Nordic alternative to Databricks/Snowflake. DuckDB + SQL transforms + Python ingest/export. Data in safe waters."
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.10"
keywords = ["data-platform", "duckdb", "etl", "sql", "analytics", "data-engineering", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5.2",          # DuckLake 1.0 requires DuckDB 1.5.2+
    "numpy>=1.24",
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlfluff>=3.0",
    "watchdog>=4.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34.0",
    "huey>=2.5",
    "sqlglot>=26.0",
    "prometheus_client>=0.20",
    "pyarrow>=18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "httpx>=0.28.0",
]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0", "google-auth>=2.0"]
redshift = ["redshift-connector>=2.0"]
warehouses = [
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "google-auth>=2.0",
    "redshift-connector>=2.0",
]

[project.urls]
Homepage = "https://github.com/chraltro/db"
Repository = "https://github.com/chraltro/db"
Issues = "https://github.com/chraltro/db/issues"

[project.scripts]
havn = "havn.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/havn", "frontend/dist", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/havn"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "havn/static"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "raw"
max_line_length = 120

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.pytest.ini_options]
testpaths = ["tests"]
