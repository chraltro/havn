[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "havn"
version = "0.2.27"
description = "Self-hosted data platform. A Nordic alternative to Databricks/Snowflake. DuckDB + SQL transforms + Python ingest/export. Data in safe waters."
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.10"
keywords = ["data-platform", "duckdb", "etl", "sql", "analytics", "data-engineering", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.5.2",          # DuckLake 1.0 requires DuckDB 1.5.2+
    "numpy>=1.24",
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlfluff>=3.0",
    "watchdog>=4.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34.0",
    "huey>=2.5",
    "sqlglot>=26.0",
    "prometheus_client>=0.20",
    "pyarrow>=18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    # starlette's TestClient needs an HTTP client library, and which one
    # depends on the starlette version resolved alongside fastapi:
    # starlette <1.0 imports httpx, starlette >=1.0 imports httpx2. Neither
    # is a dependency of starlette itself, so declaring only one makes the
    # whole suite fail at collection time the moment the other is resolved.
    # Both are test-only and small; installing both keeps `pip install -e
    # ".[dev]"` working across the range.
    "httpx>=0.28.0",
    "httpx2>=2.0",
]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0", "google-auth>=2.0"]
redshift = ["redshift-connector>=2.0"]
warehouses = [
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "google-auth>=2.0",
    "redshift-connector>=2.0",
]

[project.urls]
Homepage = "https://github.com/chraltro/havn"
Repository = "https://github.com/chraltro/havn"
Issues = "https://github.com/chraltro/havn/issues"

[project.scripts]
havn = "havn.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/havn", "frontend/dist", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/havn"]

# The built frontend (frontend/dist -> havn/static) is added by this hook for
# STANDARD wheels only, never for editable installs. A plain force-include here
# would also run for `pip install -e .` and materialize a top-level havn/static
# directory in site-packages with no __init__.py, turning `havn` into a
# namespace package and breaking import resolution under parallel test workers.
# See hatch_build.py for the full rationale.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "raw"
max_line_length = 120

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

# RF03 fires "Unqualified reference 'foo' found in single table select" by
# default. That is idiomatic SQL when only one table is in scope, and the
# noise drowns out real findings on realistic projects (37 violations on a
# 12-model project in user testing). Allow unqualified single-table refs.
[tool.sqlfluff.rules.references.qualification]
unqualified_single_table_references = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
