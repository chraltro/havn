[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "havn"
version = "0.4.0"
description = "Self-hosted data platform. A Nordic alternative to Databricks/Snowflake. DuckDB + SQL transforms + Python ingest/export. Data in safe waters."
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.10"
keywords = ["data-platform", "duckdb", "etl", "sql", "analytics", "data-engineering", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # DuckLake 1.0 requires DuckDB 1.5.2+. Tested on 1.5 and 2.0. DuckDB 2.0
    # needs Python 3.11+, so Python 3.10 installs stay on 1.5. Capped below 3:
    # each DuckDB major has changed the Python API havn is built on.
    "duckdb>=1.5.2,<3",
    # Upper bounds sit on the next major version of what havn is tested on.
    # 0.x packages are capped below 1.0.
    "numpy>=1.24,<3",
    "typer>=0.15.0,<1",
    "pyyaml>=6.0,<7",
    "ruamel.yaml>=0.18,<0.19",  # yamlio.py moves comment tokens through ruamel internals; tested on 0.18
    "rich>=13.0,<16",
    "sqlfluff>=3.0,<5",
    "watchdog>=4.0,<8",
    "fastapi>=0.115.0,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "sqlglot>=26.17,<30",
    "prometheus_client>=0.20,<1",
    "pyarrow>=18,<27",
    # Time zone data. DuckDB 1.x imports pytz to turn TIMESTAMP WITH TIME
    # ZONE values (anything built from current_timestamp or now()) into
    # Python objects; DuckDB 2.0 uses the standard library's zoneinfo, which
    # on Windows has no time zone database unless tzdata is installed.
    # Without them every query returning such a column fails, in the UI and
    # the CLI. Both are versioned by year of the time zone data they carry,
    # so they have no upper bound: a cap would block next year's tz rules.
    "pytz>=2023.3",
    # zoneinfo reads the operating system's time zone database, which
    # Windows and slim container images do not have; scheduler.timezone
    # (Europe/Oslo, ...) needs it. zoneinfo falls back to this package.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    # starlette's TestClient needs an HTTP client library, and which one
    # depends on the starlette version resolved alongside fastapi:
    # starlette <1.0 imports httpx, starlette >=1.0 imports httpx2. Neither
    # is a dependency of starlette itself, so declaring only one makes the
    # whole suite fail at collection time the moment the other is resolved.
    # Both are test-only and small; installing both keeps `pip install -e
    # ".[dev]"` working across the range.
    "httpx>=0.28.0",
    "httpx2>=2.0",
]
# OpenTelemetry traces (telemetry.opentelemetry in project.yml). Without
# these the tracing hooks are no-ops.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Server-side charts for scheduled reports (PNG snapshots, charts in the PDF
# and email). Without it reports still send: HTML tables, KPI values, CSV and
# a text-only PDF.
reports = ["matplotlib>=3.7"]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0", "google-auth>=2.0"]
redshift = ["redshift-connector>=2.0"]
warehouses = [
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "google-auth>=2.0",
    "redshift-connector>=2.0",
]

[project.urls]
Homepage = "https://github.com/chraltro/havn"
Repository = "https://github.com/chraltro/havn"
Issues = "https://github.com/chraltro/havn/issues"

[project.scripts]
havn = "havn.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/havn", "frontend/dist", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/havn"]

# The built frontend (frontend/dist -> havn/static) is added by this hook for
# STANDARD wheels only, never for editable installs. A plain force-include here
# would also run for `pip install -e .` and materialize a top-level havn/static
# directory in site-packages with no __init__.py, turning `havn` into a
# namespace package and breaking import resolution under parallel test workers.
# See hatch_build.py for the full rationale.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "raw"
max_line_length = 120

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

# RF03 fires "Unqualified reference 'foo' found in single table select" by
# default. That is idiomatic SQL when only one table is in scope, and the
# noise drowns out real findings on realistic projects (37 violations on a
# 12-model project in user testing). Allow unqualified single-table refs.
[tool.sqlfluff.rules.references.qualification]
unqualified_single_table_references = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
